spring.application.name=freightfox-dispatch-load-balancer

# ─── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ─── MongoDB Configuration ───────────────────────────────────────────────────
# MongoDB connection URI. Atlas credentials supplied via environment variables.
# Do NOT hardcode passwords in this file.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/freightfox}

# ─── Springdoc / Swagger UI ────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
