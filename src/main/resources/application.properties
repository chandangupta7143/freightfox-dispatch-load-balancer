spring.application.name=freightfox-dispatch-load-balancer

# ─── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── Database ──────────────────────────────────────────────────────────────────
# Database connection properties. Credentials supplied via environment variables.
# Do NOT hardcode passwords in this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/FreightFox}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ─── Springdoc / Swagger UI ────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
